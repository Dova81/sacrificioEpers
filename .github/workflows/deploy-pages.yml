name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Remove custom domain
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.request("DELETE /repos/{owner}/{repo}/pages/custom-domain", {
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              core.info("Custom domain removed");
            } catch (error) {
              if (error.status === 404) {
                core.info("No custom domain configured");
              } else {
                throw error;
              }
            }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
