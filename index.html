<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terminal del Grimorio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>
    <main class="terminal" aria-label="Terminal ocultista interactiva">
      <pre id="output" class="output"></pre>
      <form id="terminal-form" class="prompt" autocomplete="off">
        <span class="prompt-symbol">C:&#92;RITUAL&gt;</span>
        <input
          id="terminal-input"
          name="terminal-input"
          type="text"
          spellcheck="false"
          autofocus
          aria-label="Escribe un comando o una respuesta"
        />
      </form>
    </main>
    <script src="script.js"></script>
  </body>
</html>
